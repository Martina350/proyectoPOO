{% extends "base.html" %}

{% block titulo %}Iniciar Sesion{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-tienda">
                <div class="card-body p-4 p-md-5">
                    <h2 class="h4 fw-bold mb-1">Iniciar Sesion</h2>
                    <p class="text-muted mb-4">Accede para comprar o gestionar productos.</p>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Correo electronico</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium">Contrasena</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>

                        <button type="submit" class="btn btn-marca w-100">Ingresar</button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        No tienes cuenta?
                        <a href="{{ url_for('registro') }}">Registrate</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
