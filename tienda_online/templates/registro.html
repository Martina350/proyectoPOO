{% extends "base.html" %}

{% block titulo %}Crear Cuenta{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-tienda">
                <div class="card-body p-4 p-md-5">
                    <h2 class="h4 fw-bold mb-1">Crear Cuenta</h2>
                    <p class="text-muted mb-4">Registrate para empezar a comprar.</p>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Nombre completo</label>
                            <input type="text" class="form-control" name="nombre" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-medium">Correo electronico</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium">Contrasena</label>
                            <input type="password" class="form-control" name="password"
                                   minlength="6" required>
                        </div>

                        <button type="submit" class="btn btn-marca w-100">Registrarme</button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        Ya tienes cuenta?
                        <a href="{{ url_for('login') }}">Inicia sesion</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
