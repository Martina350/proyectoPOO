{% extends "base.html" %}
{% block titulo %}Nuevo Producto Perecible{% endblock %}
{% block content %}
    <a href="{{ url_for('inicio') }}" class="btn btn-outline-secondary mb-3">Volver al catalogo</a>
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h2 class="h4 mb-4">Nuevo Producto Perecible</h2>
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Codigo</label>
                    <input type="text" class="form-control" name="codigo" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" name="nombre" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Precio base ($)</label>
                        <input type="number" step="0.01" class="form-control" name="precio_base" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Stock inicial</label>
                        <input type="number" class="form-control" name="stock" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Dias para vencer</label>
                    <input type="number" class="form-control" name="dias_para_vencer" required>
                    <small class="text-muted">3 dias o menos = 50% descuento - 7 dias o menos = 20% descuento</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Imagen del producto</label>
                    <input type="file" class="form-control" name="imagen" accept="image/*">
                    <small class="text-muted">Opcional. png, jpg, jpeg, gif o webp. Maximo 2 MB.</small>
                </div>
                <button type="submit" class="btn btn-marca">Crear producto</button>
            </form>
        </div>
    </div>
{% endblock %}
